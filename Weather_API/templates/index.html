<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather Dashboard</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial;
            color: white;
            overflow-x: hidden;
            transition: background-image 0.6s ease-in-out;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.35);
            backdrop-filter: blur(6px);
            z-index: -1;
        }

        .container {
            max-width: 630px;
            margin: auto;
        }

        .app {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .card,
        .current {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .card {
            padding: 16px;
            margin-top: 12px;
        }

        .current {
            width: 320px;
            padding: 25px;
            border-radius: 28px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        input,
        select {
            padding: 12px 14px;
            margin: 5px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: white;
            outline: none;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        option {
            background: #1e293b;
            color: white;
        }

        button {
            padding: 12px 16px;
            margin: 5px;
            border-radius: 12px;
            border: none;
            background: rgba(59, 130, 246, 0.8);
            color: white;
            cursor: pointer;
            transition: 0.2s ease;
        }

        button:hover {
            background: rgba(59, 130, 246, 1);
            transform: translateY(-1px);
        }

        button:active {
            transform: scale(0.98);
        }

        #city {
            font-size: 28px;
            margin: 0;
        }

        #icon {
            font-size: 60px;
            margin: 10px 0;
        }

        #temp {
            font-size: 64px;
            font-weight: 200;
        }

        #condition {
            opacity: 0.8;
        }

        .forecast {
            display: flex;
            gap: 12px;

            width: 100%;
            max-width: 630px;

            overflow-x: auto;
            overflow-y: hidden;

            padding: 16px 10px;

            scroll-snap-type: x mandatory;

            -webkit-overflow-scrolling: touch;

            scrollbar-width: thin; /* Firefox */
        }

        .forecast-card {
            flex: 0 0 auto;
            min-width: 160px;

            scroll-snap-align: start;

            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            backdrop-filter: blur(15px);

            border-radius: 20px;
            padding: 12px;
            text-align: center;
        }

        .forecast-card:hover {
            transform: translateY(-4px) scale(1.05);
        }

        h1 {
            text-align: center;
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>🌦 Weather Dashboard</h1>

        <div class="row">
            <input id="cityInput" placeholder="City">

            <select id="unit">
                <option value="us">Fahrenheit</option>
                <option value="metric">Celsius</option>
            </select>

            <button onclick="loadWeather()">Search</button>
            <button onclick="addFavorite()">Add Favorite</button>
        </div>

        <div class="app">

            <div class="current">
                <h1 id="cityDisplay">--</h1>
                <div id="icon" style="font-size:48px">☀️</div>
                <div id="temp" style="font-size:64px">--°</div>
                <div id="condition">--</div>
                <div id="wind" style="opacity:0.8"></div>
                <div id="feelsLike" style="opacity:0.8"></div>
            </div>

            <div id="forecast" class="forecast"></div>

            <div class="card">
                <h2>Favorites</h2>
                <button onclick="loadFavorites()">Load</button>
                <button onclick="clearFavorites()">Clear</button>
                <div id="favorites"></div>
            </div>

            <div class="card">
                <h2>Historic</h2>
                <button onclick="loadHistoric()">Load</button>
                <button onclick="clearHistoric()">Clear</button>
                <div id="historic"></div>
            </div>
        </div>
    </div>

<script src="/static/app.js"></script>

</body>

</html>
